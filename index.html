<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sanefi Rent App</title>
<link rel="stylesheet" href="app-style.css">
  <link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1a73e8">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
<div class="auth-screen">
  <div class="auth-card" style="text-align:center;">
    <h1>Sanefi Rent App</h1>
    <p class="subtitle">Loading&hellip;</p>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-role.js"></script>
<script>
  // Entry point: send the visitor straight to the right screen based on
  // whether they're logged in, and if so, whether they're a tenant or
  // staff member.
  auth.onAuthStateChanged(async (user) => {
    if (!user) {
      window.location.href = "login.html";
      return;
    }
    const { role } = await getCurrentUserRole(user);
    if (role === "staff") {
      window.location.href = "dashboard.html";
    } else if (role === "tenant") {
      window.location.href = "portal.html";
    } else {
      window.location.href = "login.html";
    }
  });
  if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(console.error);
  });
}
</script>
</body>
</html>
