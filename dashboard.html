<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Dashboard - Sanefi Rent App</title>
<link rel="stylesheet" href="app-style.css">
<style>
  #app-loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: #ffffff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    transition: opacity .35s ease;
  }
  #app-loading-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
  #app-loading-overlay .loading-logo {
    width: 190px;
    max-width: 60vw;
    animation: sanefi-pulse 1.6s ease-in-out infinite;
  }
  @keyframes sanefi-pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.04); opacity: .85; }
  }
  #app-loading-overlay .loading-spinner {
    width: 34px;
    height: 34px;
    border: 3px solid #f6d3e6;
    border-top-color: #e6007e;
    border-radius: 50%;
    animation: sanefi-spin .8s linear infinite;
  }
  @keyframes sanefi-spin {
    to { transform: rotate(360deg); }
  }
</style>
</head>
<body>

<!-- Full-screen splash shown while auth resolves and the live caches
     (landlords/units/tenants) load for the first time. Removed by
     hideLoadingOverlay() in dashboard.js once the stat row and first
     tab have actually rendered — see the startLiveCaches(...) callback
     at the bottom of that file. -->
<div id="app-loading-overlay">
  <img src="sanefi-logo.png" alt="Sanefi Consult" class="loading-logo">
  <div class="loading-spinner"></div>
</div>

<div class="dashboard-shell">

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="mark">S</div>
      <div class="name">Sanefi Rent<span>Staff Dashboard</span></div>
      <button class="sidebar-close" id="sidebar-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Filled by dashboard.js renderTabs(); id="tabs" + .tab-btn are required hooks -->
    <nav class="tabs" id="tabs" aria-label="Dashboard sections"></nav>

    <div class="sidebar-foot">
      <button class="logout-btn" id="logout-btn">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Log Out
      </button>
    </div>
  </aside>

  <div class="main-wrap">
    <header class="app-header">
      <div class="header-left">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 id="page-title">Overview</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="notif-btn" aria-label="Notifications">&#128276;</button>
      </div>
      <div class="notif-panel" id="notif-panel"></div>
    </header>

    <div class="app-container">
      <div class="stat-row" id="stat-row"></div>
      <div id="tab-content">
        <p class="empty-state">Loading&hellip;</p>
      </div>
    </div>
  </div>

</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="auth-role.js"></script>
<script src="mpesa-parser.js"></script>
<script src="notifications.js"></script>
  <script src="report-branding.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<!-- Monthly property report (Word) — exposes window.docx.
     Using jsdelivr (mirrors npm directly) instead of cdnjs: cdnjs's
     mirror of recent docx.js releases has been unreliable about
     exposing window.docx as a browser global. -->
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js" onerror="window.__docxLoadFailed = true;"></script>
<!-- "All Properties" bundles one .docx per property into a single zip -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="dashboard.js"></script>
<!-- reply.js: click-to-navigate for notifications. Defines
     window.onNotificationClick, which notifications.js calls after
     marking a notification read. Must load after dashboard.js since it
     reads dashboard.js globals (TABS, activeTab, viewingTenantId,
     renderTabs, renderActiveTab, openThread) — those reads only happen
     later, on click, but loading it after keeps the dependency obvious. -->
<script src="reply.js"></script>
<script>
  // Off-canvas sidebar for mobile — presentation only, independent of dashboard.js
  (function () {
    const sidebar = document.getElementById("sidebar");
    const backdrop = document.getElementById("sidebar-backdrop");
    function closeSidebar() { sidebar.classList.remove("open"); backdrop.classList.remove("open"); }
    document.getElementById("menu-btn").addEventListener("click", () => {
      sidebar.classList.add("open"); backdrop.classList.add("open");
    });
    document.getElementById("sidebar-close").addEventListener("click", closeSidebar);
    backdrop.addEventListener("click", closeSidebar);
    // Picking a section on mobile should dismiss the drawer
    sidebar.addEventListener("click", (e) => { if (e.target.closest(".tab-btn")) closeSidebar(); });
  })();
</script>
</body>
</html>
